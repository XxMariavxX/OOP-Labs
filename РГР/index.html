<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles/style.css" />
    <link rel="icon" type="image/x-icon" href="./images/ico.jpg" />

    <title>РГР</title>
  </head>
  <body>
    <main class="main">
      <div class="main__container">
        <button type="button" class="main__btn" id="pickBtn">Виберіть проєкт</button>
        <input
          type="file"
          class="main__folder-input"
          id="folderInput"
          webkitdirectory
          multiple
        />

        <span class="main__or">або</span>

        <div class="dropzone dropzone--compact" id="dropZone">
          <span class="dropzone__icon">📁</span>
          <span class="dropzone__text">перетягніть проєкт сюди</span>
        </div>

      </div>

      <div class="main__status-bar">
        <span class="main__status" id="status">Папку не обрано</span>
      </div>

      <div class="main__canvas-wrapper" id="canvasWrapper">
        <canvas class="main__canvas" id="myCanvas"></canvas>
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
